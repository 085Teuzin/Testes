<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nosso Cantinho 2D - Teuzin & Daily</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      background-size: cover;
      background-position: center;
      touch-action: none;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    #top-bar {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 10;
      pointer-events: none;
    }

    .nav-arrow {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.4);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      backdrop-filter: blur(5px);
      transition: transform 0.1s, background 0.2s;
    }

    .nav-arrow:active {
      transform: scale(0.9);
    }

    #room-title {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #top-right-controls {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.1s;
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    #role-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('wall5.png');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 30;
      color: white;
    }

    #role-modal::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    .role-btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 200px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .role-btn:active {
      transform: scale(0.95);
    }

    .role-btn-boy { background: #2ed573; color: white; }
    .role-btn-girl { background: #ff6b81; color: white; }

    #loading-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 60;
      color: white;
    }

    .progress-bar-container {
      width: 200px;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #555;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #ff4757;
      transition: width 0.3s ease;
    }

    #settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 40;
    }

    .settings-card {
      background: rgba(0, 0, 0, 0.5);
      width: 260px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      color: white;
      backdrop-filter: blur(8px);
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .settings-header h3 {
      font-size: 16px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 20px;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle-switch:checked {
      background: #2ed573;
    }

    .toggle-switch::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      background: white;
      transition: transform 0.3s;
    }

    .toggle-switch:checked::before {
      transform: translateX(20px);
    }

    #chat-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 25px;
      backdrop-filter: blur(5px);
      max-width: 95vw;
      align-items: center;
    }

    #chat-input {
      border: none;
      padding: 8px 15px;
      border-radius: 15px;
      outline: none;
      font-size: 14px;
      width: 180px;
    }

    .action-btn {
      background: #ff4757;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    #interaction-btn {
      background: #ff6b81;
      display: none;
    }

    #sleep-btn {
      background: #70a1ff;
      display: none;
    }

    #interaction-modal {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
      backdrop-filter: blur(10px);
      width: 180px;
    }

    .interaction-option {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .interaction-option:active {
      background: rgba(255, 255, 255, 0.3);
    }

    #photo-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 40;
    }

    #photo-modal img {
      max-width: 80%;
      max-height: 70%;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    #close-photo {
      margin-top: 15px;
      background: #ff4757;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="role-modal">
    <button class="role-btn role-btn-boy" id="btn-boy">👦 Teuzin</button>
    <button class="role-btn role-btn-girl" id="btn-girl">👧 Daily</button>
  </div>

  <div id="loading-modal">
    <h3>Aguarde...</h3>
    <div class="progress-bar-container">
      <div class="progress-bar" id="loading-progress"></div>
    </div>
  </div>

  <div id="top-bar">
    <button class="nav-arrow" id="prev-room-btn">◀</button>
    <div id="room-title">Sala</div>
    <div id="top-right-controls">
      <button class="icon-btn" id="settings-btn">⚙️</button>
    </div>
    <button class="nav-arrow" id="next-room-btn">▶</button>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="interaction-modal">
    <button class="interaction-option" data-action="hug">🤗 Abraçar</button>
    <button class="interaction-option" data-action="kiss">😘 Beijar</button>
    <button class="interaction-option" data-action="greet">🤝 Saudação</button>
    <button class="interaction-option" data-action="tickle">😂 Cócegas</button>
    <button class="interaction-option" data-action="affection">🥰 Carinho</button>
    <button class="interaction-option" data-action="fight">😡 Brigar</button>
    <button class="interaction-option" data-action="bye">👋 Até mais</button>
  </div>

  <div id="chat-container">
    <input type="text" id="chat-input" placeholder="Digite uma mensagem..." maxlength="40">
    <button class="action-btn" id="sleep-btn">😴</button>
    <button class="action-btn" id="interaction-btn">❓️</button>
  </div>

  <div id="settings-modal">
    <div class="settings-card">
      <div class="settings-header">
        <h3>Configurações</h3>
        <button class="close-btn" id="close-settings-btn">✖</button>
      </div>
      <div class="setting-item">
        <span>Personagem</span>
        <button class="role-btn role-btn-boy" id="switch-role-btn" style="width: auto; padding: 5px 10px; font-size: 12px; box-shadow: none;">Trocar</button>
      </div>
      <div class="setting-item">
        <span>Música</span>
        <input type="checkbox" class="toggle-switch" id="toggle-bgm">
      </div>
      <div class="setting-item">
        <span>Toque</span>
        <input type="checkbox" class="toggle-switch" id="toggle-clicks" checked>
      </div>
    </div>
  </div>

  <div id="photo-modal">
    <img id="modal-img" src="photo.png" alt="Recordação">
    <button id="close-photo">✖️</button>
  </div>

  <audio id="bg-music" loop src="music.mp3"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBqRAsWfP4w-r82PZOaJcDck7W8Aeph3p8",
      authDomain: "teuzin-games.firebaseapp.com",
      databaseURL: "https://teuzin-games-default-rtdb.firebaseio.com",
      projectId: "teuzin-games",
      storageBucket: "teuzin-games.firebasestorage.app",
      messagingSenderId: "548192563345",
      appId: "1:548192563345:web:e729e39f9f266aa6a68f30",
      measurementId: "G-CB585E4B4Z"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let myRole = localStorage.getItem('saved_role') || null;
    let roomKeys = ['wall1', 'wall2', 'wall3', 'wall4', 'wall5'];
    let roomNames = {
      wall1: 'Sala',
      wall2: 'Quarto',
      wall3: 'Cozinha',
      wall4: 'Banheiro',
      wall5: 'Rua'
    };
    let currentRoomIndex = 0;
    let currentRoom = roomKeys[currentRoomIndex];
    let isDragging = false;
    let lastSaveTime = 0;

    let settings = {
      bgm: false,
      clicks: true
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      if (!settings.clicks) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    const roleNames = {
      boy: 'Teuzin',
      girl: 'Daily'
    };

    const players = {
      boy: { x: 30, y: 50, room: 'wall1', msg: '', msgTime: 0, isSleeping: false, reactionEmoji: '', reactionTime: 0 },
      girl: { x: 70, y: 50, room: 'wall1', msg: '', msgTime: 0, isSleeping: false, reactionEmoji: '', reactionTime: 0 }
    };

    const images = {
      boy: new Image(),
      girl: new Image(),
      wall1: new Image(),
      wall2: new Image(),
      wall3: new Image(),
      wall4: new Image(),
      wall5: new Image(),
      frame: new Image()
    };

    images.boy.src = 'boy.png';
    images.girl.src = 'girl.png';
    images.wall1.src = 'wall1.png';
    images.wall2.src = 'wall2.png';
    images.wall3.src = 'wall3.png';
    images.wall4.src = 'wall4.png';
    images.wall5.src = 'wall5.png';
    images.frame.src = 'frame.png';

    const bgMusic = document.getElementById('bg-music');

    function showLoading(callback) {
      const loadingModal = document.getElementById('loading-modal');
      const progressBar = document.getElementById('loading-progress');
      loadingModal.style.display = 'flex';
      progressBar.style.width = '0%';

      setTimeout(() => progressBar.style.width = '40%', 100);
      setTimeout(() => progressBar.style.width = '80%', 300);
      setTimeout(() => {
        progressBar.style.width = '100%';
        setTimeout(() => {
          loadingModal.style.display = 'none';
          if (callback) callback();
        }, 200);
      }, 500);
    }

    function updateAudioState() {
      if (settings.bgm) {
        bgMusic.play().catch(() => {});
      } else {
        bgMusic.pause();
      }
      document.getElementById('toggle-bgm').checked = settings.bgm;
    }

    document.getElementById('toggle-bgm').addEventListener('change', (e) => {
      playClickSound();
      settings.bgm = e.target.checked;
      updateAudioState();
    });

    document.getElementById('toggle-clicks').addEventListener('change', (e) => {
      settings.clicks = e.target.checked;
      playClickSound();
    });

    document.getElementById('settings-btn').addEventListener('click', () => {
      playClickSound();
      document.getElementById('settings-modal').style.display = 'flex';
    });

    document.getElementById('close-settings-btn').addEventListener('click', () => {
      playClickSound();
      document.getElementById('settings-modal').style.display = 'none';
    });

    document.getElementById('switch-role-btn').addEventListener('click', () => {
      playClickSound();
      document.getElementById('settings-modal').style.display = 'none';
      localStorage.removeItem('saved_role');
      myRole = null;
      document.getElementById('role-modal').style.display = 'flex';
    });

    function updateRoomDisplay() {
      currentRoom = roomKeys[currentRoomIndex];
      document.getElementById('room-title').innerText = roomNames[currentRoom];
      
      if (myRole) {
        players[myRole].room = currentRoom;
        if (currentRoom !== 'wall2' && players[myRole].isSleeping) {
          players[myRole].isSleeping = false;
        }
        savePositionThrottled(true);
      }
      
      document.getElementById('interaction-modal').style.display = 'none';
      checkControlsVisibility();
      render();
    }

    document.getElementById('prev-room-btn').addEventListener('click', () => {
      playClickSound();
      currentRoomIndex = (currentRoomIndex - 1 + roomKeys.length) % roomKeys.length;
      updateRoomDisplay();
    });

    document.getElementById('next-room-btn').addEventListener('click', () => {
      playClickSound();
      currentRoomIndex = (currentRoomIndex + 1) % roomKeys.length;
      updateRoomDisplay();
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    function initGame() {
      if (myRole) {
        document.getElementById('role-modal').style.display = 'none';
        showLoading(() => {
          const myRef = ref(db, `teuzin_games/game_state/players/${myRole}`);
          get(myRef).then((snapshot) => {
            const data = snapshot.val();
            if (data && data.room) {
              currentRoom = data.room;
              currentRoomIndex = roomKeys.indexOf(currentRoom);
              if (currentRoomIndex === -1) currentRoomIndex = 0;
              document.getElementById('room-title').innerText = roomNames[currentRoom];
            }
            
            const playersRef = ref(db, 'teuzin_games/game_state/players');
            onValue(playersRef, (snapshot) => {
              const data = snapshot.val();
              if (data) {
                if (data.boy) players.boy = data.boy;
                if (data.girl) players.girl = data.girl;
                checkControlsVisibility();
                render();
              }
            });
          });

          const interactionRef = ref(db, 'teuzin_games/game_state/interaction_event');
          onValue(interactionRef, (snapshot) => {
            const data = snapshot.val();
            if (data && Date.now() - data.time < 3000) {
              applyInteraction(data.action, data.from);
            }
          });

          resizeCanvas();
        });
      } else {
        document.getElementById('role-modal').style.display = 'flex';
      }
    }

    function selectRole(role) {
      playClickSound();
      myRole = role;
      localStorage.setItem('saved_role', role);
      initGame();
    }

    document.getElementById('btn-boy').addEventListener('click', () => selectRole('boy'));
    document.getElementById('btn-girl').addEventListener('click', () => selectRole('girl'));

    function checkControlsVisibility() {
      const interactionBtn = document.getElementById('interaction-btn');
      const sleepBtn = document.getElementById('sleep-btn');

      if (currentRoom === 'wall2') {
        sleepBtn.style.display = 'flex';
      } else {
        sleepBtn.style.display = 'none';
      }

      if (players.boy.room === currentRoom && players.girl.room === currentRoom) {
        const dist = Math.hypot(players.boy.x - players.girl.x, players.boy.y - players.girl.y);
        if (dist < 20) {
          interactionBtn.style.display = 'flex';
          return;
        }
      }
      interactionBtn.style.display = 'none';
      document.getElementById('interaction-modal').style.display = 'none';
    }

    document.getElementById('interaction-btn').addEventListener('click', () => {
      playClickSound();
      const modal = document.getElementById('interaction-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    });

    document.getElementById('sleep-btn').addEventListener('click', () => {
      playClickSound();
      if (!myRole) return;
      players[myRole].isSleeping = !players[myRole].isSleeping;
      savePositionThrottled(true);
      render();
    });

    document.querySelectorAll('.interaction-option').forEach(btn => {
      btn.addEventListener('click', (e) => {
        playClickSound();
        const action = e.currentTarget.getAttribute('data-action');
        document.getElementById('interaction-modal').style.display = 'none';
        
        set(ref(db, 'teuzin_games/game_state/interaction_event'), {
          action: action,
          from: myRole,
          time: Date.now()
        });
      });
    });

    function applyInteraction(action, fromRole) {
      const now = Date.now();
      const targetRole = fromRole === 'boy' ? 'girl' : 'boy';

      const map = {
        hug: { from: '🤗', target: '🤗' },
        kiss: { from: '😘', target: '😘' },
        greet: { from: '🤝', target: '🤝' },
        tickle: { from: '😁', target: '🤣' },
        affection: { from: '☺️', target: '🥰' },
        fight: { from: '😡', target: '😓' },
        bye: { from: '👋', target: '👋' }
      };

      if (map[action]) {
        players[fromRole].reactionEmoji = map[action].from;
        players[fromRole].reactionTime = now;
        players[targetRole].reactionEmoji = map[action].target;
        players[targetRole].reactionTime = now;
        render();
      }
    }

    function renderSpeechBubble(x, y, text) {
      ctx.font = '14px Arial';
      const textWidth = ctx.measureText(text).width;
      const padding = 10;
      const bubbleWidth = textWidth + padding * 2;
      const bubbleHeight = 30;
      const bubbleX = x - bubbleWidth / 2;
      const bubbleY = y - 25;

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 10);
      ctx.fill();

      ctx.fillStyle = 'black';
      ctx.textAlign = 'center';
      ctx.fillText(text, x, bubbleY + 20);
      ctx.textAlign = 'left';
    }

    function renderHeadEmoji(x, y, emoji) {
      ctx.font = '30px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(emoji, x, y - 10);
      ctx.textAlign = 'left';
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bgImg = images[currentRoom];
      if (bgImg.complete && bgImg.naturalWidth !== 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (currentRoom === 'wall1' && images.frame.complete && images.frame.naturalWidth !== 0) {
        ctx.drawImage(images.frame, canvas.width * 0.45, canvas.height * 0.2, 80, 80);
      }

      const charHeight = canvas.height * 0.25;
      const charWidth = charHeight * 0.6;

      ['boy', 'girl'].forEach(role => {
        const p = players[role];
        if (p.room === currentRoom) {
          const xPx = (p.x / 100) * canvas.width;
          const yPx = (p.y / 100) * canvas.height;

          ctx.save();
          ctx.translate(xPx, yPx);

          if (p.isSleeping) {
            ctx.rotate(90 * Math.PI / 180);
          }

          const img = images[role];
          if (img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, -charWidth / 2, -charHeight / 2, charWidth, charHeight);
          } else {
            ctx.fillStyle = role === 'boy' ? '#2ed573' : '#ff6b81';
            ctx.fillRect(-charWidth / 2, -charHeight / 2, charWidth, charHeight);
          }

          ctx.restore();

          if (p.reactionEmoji && Date.now() - p.reactionTime < 3000) {
            renderHeadEmoji(xPx, yPx - (charHeight / 2));
          }

          if (p.msg && Date.now() - p.msgTime < 5000) {
            renderSpeechBubble(xPx, yPx - (charHeight / 2), p.msg);
          }
        }
      });
    }

    Object.values(images).forEach(img => img.onload = render);

    function sendMessage() {
      playClickSound();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (text && myRole) {
        players[myRole].msg = text;
        players[myRole].msgTime = Date.now();
        input.value = '';
        savePositionThrottled(true);
        render();
      }
    }

    document.getElementById('chat-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      return {
        xPct: ((clientX - rect.left) / canvas.width) * 100,
        yPct: ((clientY - rect.top) / canvas.height) * 100
      };
    }

    function startDrag(e) {
      if (!myRole) return;
      const coords = getCoordinates(e);
      const myP = players[myRole];

      if (currentRoom === 'wall1') {
        const frameX = 45;
        const frameY = 20;
        if (Math.abs(coords.xPct - frameX) < 5 && Math.abs(coords.yPct - frameY) < 5) {
          playClickSound();
          document.getElementById('photo-modal').style.display = 'flex';
          return;
        }
      }

      if (myP.room === currentRoom) {
        const dist = Math.hypot(coords.xPct - myP.x, coords.yPct - myP.y);
        if (dist < 12) {
          isDragging = true;
        }
      }
    }

    function moveDrag(e) {
      if (!isDragging || !myRole) return;
      e.preventDefault();
      const coords = getCoordinates(e);

      players[myRole].x = Math.max(5, Math.min(95, coords.xPct));
      players[myRole].y = Math.max(5, Math.min(95, coords.yPct));

      checkControlsVisibility();
      render();
      savePositionThrottled();
    }

    function stopDrag() {
      isDragging = false;
    }

    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', stopDrag);

    canvas.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('touchend', stopDrag);

    document.getElementById('close-photo').addEventListener('click', () => {
      playClickSound();
      document.getElementById('photo-modal').style.display = 'none';
    });

    function savePositionThrottled(force = false) {
      const now = Date.now();
      if (force || now - lastSaveTime > 50) {
        if (!myRole) return;
        set(ref(db, `teuzin_games/game_state/players/${myRole}`), {
          x: players[myRole].x,
          y: players[myRole].y,
          room: players[myRole].room,
          msg: players[myRole].msg || '',
          msgTime: players[myRole].msgTime || 0,
          isSleeping: players[myRole].isSleeping || false
        });
        lastSaveTime = now;
      }
    }

    initGame();
  </script>
</body>
