<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor MP3 para M4A</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Conversor MP3 para M4A</h2>
        <input type="file" id="uploader" accept=".mp3"><br>
        <button id="convertBtn" disabled>Converter e Comprimir</button>
        <p id="status">Aguardando arquivo...</p>
        <audio id="outputAudio" controls style="display:none; width:100%; margin-top:15px;"></audio>
    </div>

    <script type="module">
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/ffmpeg.js';
        import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        const uploader = document.getElementById('uploader');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');
        const outputAudio = document.getElementById('outputAudio');

        let ffmpeg = null;

        async function loadFFmpeg() {
            status.textContent = 'Carregando motor de áudio...';
            ffmpeg = new FFmpeg();
            
            // URLs dos arquivos core do FFmpeg via CDN
            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
            await ffmpeg.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
            });
            status.textContent = 'Pronto para converter!';
            convertBtn.disabled = false;
        }

        loadFFmpeg();

        convertBtn.onclick = async () => {
            if (!uploader.files.length) return;
            const file = uploader.files[0];

            convertBtn.disabled = true;
            status.textContent = 'Lendo arquivo...';

            // Escreve o arquivo MP3 na memória virtual do FFmpeg
            await ffmpeg.writeFile('input.mp3', await fetchFile(file));

            status.textContent = 'Convertendo e comprimindo (M4A)...';

            // Executa o comando FFmpeg: 
            // -i input.mp3 (entrada) 
            // -c:a aac (codec de áudio AAC para M4A) 
            // -b:a 128k (taxa de bits para compressão - você pode ajustar) 
            // output.m4a (saída)
            await ffmpeg.exec(['-i', 'input.mp3', '-c:a', 'aac', '-b:a', '128k', 'output.m4a']);

            status.textContent = 'Finalizado!';

            // Lê o resultado da memória virtual
            const data = await ffmpeg.readFile('output.m4a');
            
            // Cria um link/blob para reprodução e download
            const blob = new Blob([data.buffer], { type: 'audio/mp4' });
            const url = URL.createObjectURL(blob);
            
            outputAudio.src = url;
            outputAudio.style.display = 'block';
            
            // Opcional: Criar botão de download automático
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = file.name.replace(/\.[^/.]+$/, "") + '.m4a';
            downloadLink.textContent = '📥 Baixar M4A Comprimido';
            downloadLink.style.display = 'block';
            downloadLink.style.marginTop = '10px';
            document.querySelector('.container').appendChild(downloadLink);
        };
    </script>

</body>
</html>
